[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapplizer"
version = "0.1.0"
description = "Export Apple Maps guide share links to KML/KMZ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mapplizer = "mapplizer.cli:main"

[tool.setuptools.packages.find]
include = ["mapplizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
